<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fffdfa">
    <script>
      // Set the theme before first paint so the page never flashes the wrong colours.
      // Saved choice wins; otherwise follow the phone/computer setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>{% block title %}Library Status{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-bar">
      <div class="app-bar__inner">
        <a class="brand" href="/">
          Library Status
        </a>
        {% set path = request.url.path %}
        <div class="app-bar__end">
        <nav class="nav" aria-label="Main">
          <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Status</a>
          <a href="/leaderboard" {% if path == '/leaderboard' %}aria-current="page"{% endif %}>Leaderboard</a>
          <a href="/premium" {% if path == '/premium' %}aria-current="page"{% endif %}>Premium</a>
          <a href="/account" {% if path == '/account' %}aria-current="page"{% endif %}>Account</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        </div>
      </div>
    </header>
    <main id="main" class="page" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <p>Live status is estimated from student reports and may be wrong. Built at HackUCD 2026.</p>
    </footer>
    <script src="{{ url_for('static', path='/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
