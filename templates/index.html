<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hack UCD · Flask demo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #eef2ff; font-family: system-ui, sans-serif; }
      main { width: min(100%, 480px); padding: 48px 32px; border: 1px solid #334155; border-radius: 24px; background: #182235; text-align: center; box-shadow: 0 24px 80px #0004; }
      .badge { color: #6ee7b7; font-size: 12px; letter-spacing: .15em; font-weight: 700; }
      h1 { margin: 20px 0 12px; font-size: clamp(32px, 6vw, 44px); letter-spacing: -.04em; }
      p { color: #cbd5e1; line-height: 1.6; }
      button { margin-top: 20px; padding: 14px 26px; border: 0; border-radius: 12px; background: #6ee7b7; color: #10281e; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #a7f3d0; }
      button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
      button:disabled { opacity: .6; cursor: wait; }
      #message { min-height: 52px; margin-top: 24px; margin-bottom: 0; }
      input { width: 100%; padding: 14px; border: 1px solid #64748b; border-radius: 10px; background: #101827; color: white; font: inherit; }
      label { display: block; text-align: left; margin: 24px 0 8px; }
      ul { padding-left: 24px; text-align: left; overflow-wrap: anywhere; }
      li { margin: 12px 0; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">HACK UCD · DEMO</span>
      <h1>A little button.<br>A working backend.</h1>
      <p>Click below to say hello to your Python app.</p>
      <button id="hello" type="button">Say hello ↗</button>
      <p id="message" role="status" aria-live="polite">Ready when you are.</p>
      <form id="notes-form">
        <label for="note">Save a note to the database</label>
        <input id="note" name="text" maxlength="200" required placeholder="Hello, hackathon!">
        <button id="save" type="submit">Save note</button>
      </form>
      <p id="notes-status" role="status" aria-live="polite"></p>
      <ul id="notes" aria-label="Saved notes"></ul>
      <p>Shared demo: notes are public. Please don’t enter personal information.</p>
    </main>
    <script>
      const notesList = document.getElementById('notes');
      const notesStatus = document.getElementById('notes-status');
      const save = document.getElementById('save');
      async function loadNotes() {
        const response = await fetch('/api/notes');
        if (!response.ok) throw new Error('Could not load notes. Check database setup.');
        const data = await response.json();
        notesList.replaceChildren();
        for (const note of data.notes) {
          const item = document.createElement('li');
          item.textContent = note.text;
          notesList.appendChild(item);
        }
        notesStatus.textContent = data.notes.length ? 'Latest saved notes' : 'No notes yet. Add the first one!';
      }
      document.getElementById('notes-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        save.disabled = true;
        try {
          const response = await fetch('/api/notes', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: document.getElementById('note').value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not save note.');
          document.getElementById('notes-form').reset();
          await loadNotes();
          notesStatus.textContent = 'Saved to the database!';
        } catch (error) { notesStatus.textContent = error.message; }
        finally { save.disabled = false; }
      });
      loadNotes().catch(error => { notesStatus.textContent = error.message; });
      const button = document.getElementById('hello');
      const message = document.getElementById('message');
      button.addEventListener('click', async () => {
        button.disabled = true;
        message.textContent = 'Saying hello…';
        try {
          const response = await fetch('/api/click', { method: 'POST' });
          if (!response.ok) throw new Error('Request failed');
          const data = await response.json();
          message.textContent = data.message;
        } catch {
          message.textContent = 'Could not reach the server. Please try again.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
